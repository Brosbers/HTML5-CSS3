<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <p> <!--Oninput-->
            <label for="iNum1">Número 1:</label>
            <input type="number" name="Num1" id="iNum1" min="0" max="50" required oninput="iSoma.innerHTML = Number(iNum1.value) + Number(iNum2.value)"> <!--JavaScript-->
        </p>

        <p>
            <label for="iNum2">Número 2:</label>
            <input type="number" name="Num2" id="iNum2" min="0" max="50" required oninput="iSoma.innerHTML = Number(iNum1.value) + Number(iNum2.value)">
        </p>

        <p><!--Output-->
            <label for="iSoma">Soma:</label>
            <output name="soma" id="iSoma">0</output>
            <!--OBS: O output so serve para mostrar na tela, ele nao calcula nada de vdd-->
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
