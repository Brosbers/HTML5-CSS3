<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <p>
            <label for="iAno">Em que ano você nasceu?</label>
            <input type="number" name="ano" id="iAno" min="1900" max="2026" value="2000" oninput="calcIdade()">
        </p>

        <label for="iIdade">Sua idade é:</label>
        <output id="iIdade">0</output>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <script>
        function calcIdade() {
            let atual = new Date().getFullYear()
            iIdade.innerHTML = Number(atual) - Number(iAno.value)        
        }
    </script>

</body>
</html>
