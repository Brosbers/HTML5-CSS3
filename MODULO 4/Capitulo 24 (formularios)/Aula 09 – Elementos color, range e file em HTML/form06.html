<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="cadastro.php" method="post" autocomplete="on">

        <p><!--Color-->
            <label for="icor">Cor:</label>
            <input type="color" name="cor" id="icor" value="#FF8DA1"><!--Codigo da cor-->
        </p>
        
        <p><!--Range-->
            <label for="inivel">Nivel de satisfação: </label>
            <input type="range" name="nivel" id="inivel" min="0" max="5" value="0"><!--Nesse caso o value serve para apontar onde a bolinha deve começar-->
        </p>
        
        <p><!--File-->
            <label for="ifoto">Foto do perfil:</label>
            <input type="file" name="foto" id="ifoto">
            <!--Quando usar envio de arquivos, nao pode usar o method get-->
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
