<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
        <!--fieldset serve pra agrupar tudo numa caixa-->
            <legend>Dados pessoais</legend>
            <!--legend escreve (Dados pessoais) na caixa do fildset-->    
            <p>
                <label for="inome">Nome</label>
                <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required>
            </p>
            <p>
                <label for="iemail">E-mail</label>
                <input type="email" name="email" id="iemail" autocomplete="email" required>
            </p>
            <p>
                <label for="itel">Telefone</label>
                <input type="tel" name="tel" id="itel" autocomplete="tel" placeholder="(xx)xxxxx-xxxx" required pattern="^\(\d{2}\)\d{4,5}-\d{4}$">
                <!-- O \d{quantos digitos}... nesse caso o numero tem q estar no formato (71)99999-9999 -->
            </p>
            <!--Estudar mais sobre RegEx-->
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

</body>
</html>
