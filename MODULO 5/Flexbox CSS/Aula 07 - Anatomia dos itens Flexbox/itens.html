<!--                                            Flex-item (itens de dentro do conteiner)

    1- Order: (configura no css) O valor do order é qm dita em que ordem o conteudo deve aparecer, sempre em ordem crescente. EX: |order: 1||order: 7||order: 4||order: -2|; ficaria: |order: -2||order: 1||order: 4||order: 7|; obs: TODO item em flexbox que estiver dentro do conteiner pai vai ter order: 0; como padrão 
    
    2- Align-self: (configura no css) Se aplica diretamente aos itens e vai funcionar diretamente no CROSS-AXIS 

        2.1- Align-self: auto; : Vai herdar a caracteristica de alinhamento vertical do seu PAI, seja ele o align-content ou o align-item.

        2.2- Align-self: flex-start; : Alinhamento grudado no cross-start

        2.3- Align-self: flex-end; : Alinhamento grudado no cross-end

        2.4- Align-self: center; : Vai calcular o meio entre o cross-start e o cross-end

        2.5- Align-self: stretch; : Vai esticar para ocupar todo o espaço do cross-axis 

-->
