<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box Model</title>
    <style>
        div.conteiner{
            background-color: lightsalmon;
            display: flex; 
            flex-flow: row wrap; /*flex-direction: row; + flex-wrap: wrap;*/
        }
        div.item{
            background-color: lightseagreen;
            border: 1px solid black;
            text-align: center;
            flex: auto; /*Faz com que nao tenham espaços em branco(vazios) dentro do elemento pai*/ /*So funciona no filho*/
        }
    </style>
</head>
<body>
    
    <div class="conteiner"> <!--Div Pai-->
        <div class="item">Exemplo de bloco A</div> <!-- Divs Filhos-->
        <div class="item">Exemplo de bloco B</div>
        <div class="item">Exemplo de bloco C</div>
        <div class="item">Exemplo de bloco D</div>
        <div class="item">Exemplo de bloco E</div>
        <div class="item">Exemplo de bloco F</div>
        <div class="item">Exemplo de bloco G</div>
    </div>

</body>
</html>
