<!-- 1- Flex-Wrap:
        1.1- flex-wrap:nowrap; (padrão): O conteudo vai encolher dentro da caixa a depender do conteudo

        1.2- flex-wrap: wrap; : O conteudo vai quebrar na direção do cross-axis (no padrão [flex-direction: row;] vai ser na vertical para baixo)

        1.3- flex-wrap: wrap-reverse; : O conteudo vai quebrar na direçao contraria do cross-axis (no padrao a div quebrada vai pra cima ao inves de pra baixo na vertical)

    2- Flex-Flow: (flex-direction + flex-wrap) ---shorthand---

        2.1- Se a configuraçao do conteiner é por ex flex-direction: row; e flex-wrap: nowrap; tudo pode ser simplificado com o flex-flow: row nowrap;
