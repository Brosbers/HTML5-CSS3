<!--1- Justify-content: 
        1.1- Alinhamento (faz o alinhamento em relação ao MAIN-AXIS [Eixo principal])
            1.1.1- Justify-content: flex-start;(padrão) : quer dizer que o primeiro item ficara grudado ao main-start, e se caso houver um espaço vazio, vai ficar perto do main-end   

            1.1.2- Justify-content: flex-end; : quer dizer que o ultimo item ficara grudado ao main-end, e se caso houver um espaço vazio, vai ficar perto do main-start

            1.1.3- Justify-content: center; : os conteudos serao alinhados exatamente no meio, e se caso houver espaços vazios, ficarão igualmente divididos no main-start e main-end

        1.2- Espaçamento (espaçamento entre os itens)
            1.2.1- Justify-content: space-between; : vai grudar o primeiro conteudo no main-start e o ultimo no main-end, e todos os outros conteudos estarao no meio espaçados igualmente entre eles
            1.2.2- Justify-content: space-evenly; : nao vai grudar o primeiro e o ultimo item no main-start e main-end, ele vai colocar os elementos dentro do conteiner de forma que antes e depois do item tenhamos espaçamentos iguais
            1.2.3- Justify-content: space-around; :  cada item vai ter um espaço anterior e um posterior, espaço  [1]  espaço + espaço  [2]  espaço + espaço  [3]  espaço

    2- Align-items: (sempre no sentido do CROSS-AXIS [Eixo transversal])  
        1.1- Align-items: stretch;(padrão) : se voce aumentar o cross-axis, o item vai esticar de acordo com o sentido do cross-axis
        
        1.2- Align-items: flex-start; : os itens vão grudar no cross-start, e se houver espaço vazio, vai ficar embaixo, perto do cross-end

        1.3- Align-items: flex-end; : os itens vao grudar no final do cross-axis, no cross-end, e se houver espaço em branco vai ficar em cima, perto do cross-start 

        1.4- Align-items: center; : vai dividir o cross-axis na metade, inserir os itens no meio, e vai fazer o alinhamento para que sobre o mesmo espaço para o cross start e para o cross-end 
 -->
