<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na pratica 3</title>
    <style>
        
div.container{ 
    border: 3px solid blue;
    display: grid;
    height: 1000px;

    grid-template-rows: repeat(3, 80px);  
    grid-template-columns: 100px 20% repeat(2, 1fr);
    /* OU grid-template: repeat(3,80px) / 100px 20% repeat(2, 1fr);*/
    
    grid-auto-rows: 80px; /*Sempre que criar uma linha nova excedente ela terá 80px*/
    grid-auto-flow: row; /*Valor padrão: rows; column*/
    grid-auto-columns: 120px; /*Sempre que criar uma coluna nova excedente ela terá 120px*/

    gap: 5px;  
    place-items: stretch stretch; 
    place-content: stretch stretch; 
}
div.item{
    border: 3px solid red;
    padding: 5px;
}

    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
</body>
</html>
