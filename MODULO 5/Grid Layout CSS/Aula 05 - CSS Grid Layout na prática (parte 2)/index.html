<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na pratica</title>
    <style>
        
        div.container{ 
            border: 3px solid blue;
            height: 250px;
            /*Dica: Use o Grid view com as ferramentas do desenvolvedor > elements > styles - para mexer nas configuraçoes e ver tudo acontecendo em tempo real*/
            display: grid;
            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto;
            gap: 5px; /*Grid-gap VIROU SÓ gap*/
        }

        div.item{
            border: 3px solid red;
            padding: 5px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
    </div>
</body>
</html>
