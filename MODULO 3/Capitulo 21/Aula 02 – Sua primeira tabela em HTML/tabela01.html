<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 400px;
            border-collapse: collapse; /*Para fazer as linhas se juntarem como uma tabela*/
        }
      
        td{
            border: 1px solid black;
            padding: 8px;
        }

        tr.linha{
            background-color: grey;
        }

        td.dado{
            background-color: yellow;
        }

    </style>
</head>
<body>
    
    <h1>Minha primeira tabela</h1>

    <!-- HIERARQUIA DE TABELAS (simples)
         TABLE = Tabela
            TABLE ROW = Linhas de tabela
                TABLE HEADER = Cabeçalho de tabela
                TABLE DATA = Dado de tabela  

    -->
    <table>
        <!--tr = table row-->
        <tr> <!--Primeira linha-->
            
            <td>A1</td><!--Table Data (conteudo)-->
            <td>B1</td>
            <td>C1</td>

        </tr>
        <tr class="linha"> <!--Segunda Linha-->

            <td>A2</td>
            <td>B2</td>
            <td>C2</td>

        </tr>
        <tr> <!--Terceira linha-->

            <td>A3
            <td>B3
            <td>C3

        
        <tr> <!--Quarta linha-->

            <td>A4
            <td class="dado">B4
            <td>C4
           
        <!--OBS: As tags tr e td nao sao obrigatorias o fechamento (</tr>, </td>)-->        
        
    </table>

</body>
</html>
