<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse; /*Para fazer as linhas se juntarem como uma tabela*/
        }
      
        td{
            border: 1px solid black;
            padding: 8px;
            text-align: center; /*Alinhamento Horizontal*/ /*Left, Right, Center*/
            vertical-align: middle; /*Alinhamento Vertical*/ /*Top, Middle, Bottom*/
        }
        td.numero{
            text-align: right;
        }

    </style>
</head>
<body>
    
    <h1>Minha primeira tabela</h1>

    <!-- HIERARQUIA DE TABELAS (simples)
         TABLE = Tabela
            TABLE ROW = Linhas de tabela
                TABLE HEADER = Cabeçalho de tabela
                TABLE DATA = Dado de tabela  

    -->
    <table>
        <!--tr = table row-->
        <tr> <!--Primeira linha-->
            
            <td>A1</td><!--Table Data (conteudo)-->
            <td>B1</td>
            <td>C1</td>

        </tr>
        <tr> <!--Segunda Linha-->

            <td>A2</td>
            <td>B2</td>
            <td class="numero">C2</td>

        </tr>
        <tr> <!--Terceira linha-->

            <td>A3
            <td>B3
            <td class="numero">C3

        
        <tr> <!--Quarta linha-->

            <td>A4
            <td>B4
            <td>C4
              
        
    </table>

</body>
</html>
