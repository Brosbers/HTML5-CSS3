<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        
        /*  SELETORES PERSONALIZADOS
            #   = id 
            .   = class
            :   = pseudo-class
            ::  = pseudo-element                    
            >   = children 
        
        */

        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
            color: red;
            text-decoration: none;
            font-weight: bold;
        }
        a:visited{ /* Cor quando o link ja foi visitado antes */ 
            color: darkred;
        }
        a:hover{
            color: black;
            text-decoration: underline;
        }
        a:active{ /* Enquanto o link é clicado, ele muda de cor*/
            color: yellow;
        }
        
        a::after{ /* significa q depois de todos os links, aparecera oq vc pedir   */
            content: '[link]';
            color: darkgrey;
            font-weight: normal;
            text-decoration: none;
        }
        a::before{
            content: '[link]';
            color: darkgrey;
            font-weight: normal;
            text-decoration: none;
        }
        .especial{
            background-color: rgb(196, 123, 123);
        }
        .especial::before{
            content: '➡️';
        }
        .especial::after{
            content: '⬅️';
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://www.youtube.com" target="_blank">Repositorio do Github</a></li>
        <li><a href="https://www.youtube.com" target="_blank" class="especial">Canal do Youtube</a></li>
        <li><a href="https://www.youtube.com" target="_blank">CursoEmVideo</a></li>
    </ul>
</body>
</html>
