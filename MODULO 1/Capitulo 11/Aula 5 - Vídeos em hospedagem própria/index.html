<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML5</title>
</head>
<body>
    
    <h1>Inserindo videos hospedados localmente</h1>
    <p>Este video esta hospedado no meu proprio servidor</p>
    <video width="590px" controls poster="imagens/little-puppies-in-the.jpeg">
        <!-- Preferencialmente botar na ordem os arquivos menores antes dos maiores -->
        <source src="midias/Meu-Video.m4v" type="video/mp4"> 
        <source src="midias/Meu-Video.webm" type="video/webm">
        <source src="midias/meu-video.ogv" type="video/ogg">
        <source src="midias/meu-video.mp4" type="video/mp4">
        <p>Seu navegador nao tem compatibilidade com reprodução de videos</p>
       
    </video>

</body>
</html>
