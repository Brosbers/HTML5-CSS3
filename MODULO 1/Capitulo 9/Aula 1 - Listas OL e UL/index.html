<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    
    <h1>Trabalhando com Listas</h1>
    
    <h2>Listas Ordenadas</h2>
    <ol type="1"> <!-- Types 1(padrao), A, a, I, i -->
    
        <li>Acordar</li>
        <li>Ligar para Carlão</li>
        <li>Tomar café</li>
        <li>Escovar os dentes</li>
        <li>Almoçar</li>
        <li>Jantar</li>
        <li>Dormir</li>
    
    </ol> <!--Ordinary Lists-->
    
    <h2>Listas nao Ordenadas</h2>
    <ul type="disc"> <!-- Types disc(padrao), circle, square -->
        
        <li>Pão</li>
        <li>Leite</li>
        <li>Chocolate</li>
        <li>Suco</li>

    </ul> <!--Unordinary Lists-->

</body>
</html>
